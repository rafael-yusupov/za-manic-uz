<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Za_manic — подберите процедуру и узнайте цену</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--soft:#F5F4F2;--ink:#2B2724;--muted:#7A736C;--line:#E6E2DC;--gold:#B08D57;--gold-hi:#E3C993;--bronze:#7A5E33;--tint:#F8F2E8;--on:#FFFFFF;--err:#B4533F;--rose:#E6C9BF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--soft:#221F1C;--ink:#F2EDE6;--muted:#A69D92;--line:#35302B;--gold:#C9A66B;--gold-hi:#EBD3A0;--bronze:#DDBF86;--tint:#2A241E;--on:#1E1A16;--err:#E58B76;--rose:#4A3630}}
:root[data-theme="dark"]{--bg:#171513;--soft:#221F1C;--ink:#F2EDE6;--muted:#A69D92;--line:#35302B;--gold:#C9A66B;--gold-hi:#EBD3A0;--bronze:#DDBF86;--tint:#2A241E;--on:#1E1A16;--err:#E58B76;--rose:#4A3630}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:12px}
.wrap{max-width:520px;margin:0 auto;padding:16px 18px 32px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;height:44px;margin-bottom:10px}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.back svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.2}
.back[hidden],.top[hidden]{display:none}
.prog{flex:1}
.prog small{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-hi),var(--gold));border-radius:3px;transition:width .35s ease}
.logo-s{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line);flex:none}
#view{flex:1;display:flex;flex-direction:column}
.enter{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1;margin:0}
h2{font-size:30px;margin:6px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}

/* старт */
.start{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:10px 0}
.start .logo{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;background:#fff;box-shadow:0 14px 40px -20px rgba(80,60,25,.5)}
.start h1{font-size:clamp(34px,9vw,44px)}
.start p{color:var(--muted);margin:10px auto 22px;max-width:34ch}
.fan{display:flex;justify-content:center;gap:8px;margin:0 0 26px;height:74px;align-items:flex-end}
.fan .nl{width:30px}
.perks{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.perks span::before{content:"✓ ";color:var(--gold);font-weight:700}

/* варианты */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:64px;padding:12px 14px;border:1.5px solid var(--line);border-radius:18px;background:var(--bg);transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--tint)}
.opt .ic{width:46px;height:46px;border-radius:14px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}
.opt .ic svg{width:40px;height:40px;stroke-width:2}
.opt .t{flex:1;min-width:0}
.opt b{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.opt .pr{font-size:13px;font-weight:700;color:var(--bronze);margin-top:3px;display:block}
.two .opt{flex-direction:column;align-items:stretch;text-align:center;padding:14px 10px 12px;gap:10px}
.sw{display:flex;justify-content:center;gap:5px;height:58px;align-items:flex-end}
.nl{width:22px;border-radius:12px 12px 7px 7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);position:relative;overflow:hidden}
.nl::after{content:"";position:absolute;left:4px;top:5px;width:3px;height:35%;border-radius:2px;background:rgba(255,255,255,.55)}
.nl:nth-child(1){height:44px}.nl:nth-child(2){height:56px}.nl:nth-child(3){height:48px}
.fan .nl:nth-child(1){height:52px}.fan .nl:nth-child(2){height:66px}.fan .nl:nth-child(3){height:74px}.fan .nl:nth-child(4){height:68px}.fan .nl:nth-child(5){height:54px}

/* результат */
.res{background:var(--tint);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:22px;padding:16px}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed color-mix(in srgb,var(--gold) 35%,transparent);font-size:14.5px}
.line:last-of-type{border-bottom:0}
.line span:last-child{font-weight:700;white-space:nowrap;text-align:right}
.sum{margin-top:6px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--gold) 45%,transparent);text-align:center}
.sum small{display:block;font-size:13px;color:var(--muted)}
.sum strong{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:36px;line-height:1.1;color:var(--bronze);margin:2px 0}
.fine{font-size:12.5px;color:var(--muted);text-align:center;margin:12px 0 0}
.actions{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.cta{height:56px;border-radius:16px;font-weight:700;font-size:16px;background:var(--gold);color:var(--on);display:flex;align-items:center;justify-content:center;text-decoration:none;width:100%}
.cta[disabled]{opacity:.4}
.ghost{height:50px;border-radius:16px;border:1px solid var(--line);font-weight:600;display:flex;align-items:center;justify-content:center;width:100%;color:var(--ink);text-decoration:none}

/* форма */
.f{margin-bottom:16px}
.f>label,.f>span{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.f input,.f select{width:100%;height:52px;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;outline:none;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 15px) 23px;background-size:5px 5px;background-repeat:no-repeat}
.f input:focus,.f select:focus{border-color:var(--gold);background-color:var(--bg)}
.e{color:var(--err);font-size:12.5px;margin-top:5px;min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--on)}

.ok{width:84px;height:84px;margin:10px auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi),var(--gold));display:flex;align-items:center;justify-content:center}
.ok svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.msg{white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13.5px;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.h3{font-size:17px;font-weight:700;margin:22px 0 10px}
.line .mut{color:var(--muted);font-weight:500}
.line.tot span{font-weight:700}
.tiers{display:grid;gap:12px}
.tier{position:relative;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"i t p" "d d d";gap:6px 14px;align-items:center;text-align:left;width:100%;padding:18px 16px 16px;border-radius:20px;border:1.5px solid var(--line);background:var(--soft);transition:border-color .15s,background .15s,box-shadow .15s}
.tier.t-top{background:linear-gradient(135deg,color-mix(in srgb,var(--gold-hi) 30%,var(--bg)),var(--tint));border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.tier[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.ti{grid-area:i;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.ti svg{width:40px;height:40px}
.ti.sm{width:34px;height:34px}.ti.sm svg{width:30px;height:30px}
.tt{grid-area:t;min-width:0}
.tt b{display:block;white-space:nowrap;font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;line-height:1.05;color:var(--bronze)}
.tier.t-master .tt b{color:var(--ink)}
.tt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tp{grid-area:p;font-weight:700;font-size:17px;color:var(--bronze);white-space:nowrap}
.tier.t-master .tp{color:var(--ink)}
.td{grid-area:d;color:var(--muted);font-size:13.5px;margin-top:4px}
.tb{position:absolute;top:-1px;right:18px;background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#2B2116;font-size:11px;font-weight:700;padding:4px 10px;border-radius:0 0 10px 10px}
@media (max-width:360px){.tp{font-size:15px}.tt b{font-size:21px}}
.check{background:var(--tint);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:20px;padding:14px 16px;margin-bottom:20px}
.ch-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:2px;border-bottom:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.ch-h div{flex:1;min-width:0}.ch-h b{display:block}.ch-h small{color:var(--muted);font-size:13px}
.edit{font-size:13px;font-weight:600;color:var(--bronze);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.chip em{font-style:normal;font-weight:500;font-size:12px;opacity:.75;margin-left:4px}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 58px;height:74px;border-radius:16px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.day small{font-size:11px;color:var(--muted)}.day b{font-size:20px;line-height:1.1}
.day[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on)}
.day[aria-pressed="true"] small{color:var(--on);opacity:.85}
.day[disabled]{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:350px){.slots{grid-template-columns:repeat(3,1fr)}}
.slot{height:44px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on)}
.cta:disabled{opacity:.4;cursor:not-allowed}
</style>

 length:{t:"Какая длина ногтей?",o:[
   {v:"short",l:"Короткие или средние",ic:"short"},
   {v:"long",l:"Длинные или сложная форма",ic:"long",p:["Длинные / сложные ногти",50000,50000,20]}]},
 design:{t:"Добавим дизайн?",o:[
   {v:"no",l:"Без дизайна",ic:"no"},
   {v:"design",l:"Дизайн",d:"Стразы, рисунки, фольга, блёстки",ic:"sparkle",p:["Дизайн",10000,10000,10]},
   {v:"stamp",l:"Стемпинг",d:"Аккуратный узор штампом",ic:"stamp",p:["Стемпинг",10000,10000,10]}]},
 ptype:{t:"Какой педикюр?",o:[
   {v:"smart",l:"Smart педикюр",d:"Без распаривания, мягко убирает огрубевшую кожу",ic:"feet"},
   {v:"classic",l:"Классический",d:"С распариванием и лёгким массажем",ic:"drop"},
   {v:"combi",l:"Комбинированный",d:"Классика + аппаратная обработка",ic:"feet"}]},
 pcover:{t:"Нужно покрытие на ногах?",o:[
   {v:"yes",l:"Да, с покрытием",d:"Держится до 4 недель",ic:"polish"},
   {v:"no",l:"Нет, только уход",ic:"leaf"}]},
 heels:{t:"Есть сухость или трещины на пятках?",o:[
   {v:"no",l:"Нет",ic:"no"},
   {v:"yes",l:"Да, нужна особая обработка",d:"Глубокая обработка и полировка",ic:"heel",p:["Работа со сложными пятками",50000,60000,15]}]},
 ext:{t:"Что нужно?",o:[
   {v:"new",l:"Нарастить ногти",d:"Новая длина и форма",ic:"ext"},
   {v:"fix",l:"Коррекция",d:"Уже есть наращивание",ic:"fix",p:["Коррекция нарощенных ногтей",200000,250000,120]}]},
 extType:{t:"Какой способ наращивания?",o:[
   {v:"forms",l:"На верхние формы",d:"Прочные, лёгкие и естественные",ic:"long",p:["Наращивание на верхние формы",350000,400000,120]},
   {v:"tips",l:"На гелевые типсы",d:"Идеальная форма и длина",ic:"long",p:["Наращивание на гелевые типсы",300000,350000,120]},
   {v:"any",l:"Не знаю — пусть подскажет мастер",ic:"question",p:["Наращивание (способ подберёт мастер)",300000,400000,120]}]}
};
const PEDI={smart:{yes:["Смарт педикюр + покрытие",250000,360000,90],no:["Smart педикюр",250000,300000,60]},
  classic:{yes:["Классический педикюр с покрытием",200000,300000,90],no:["Классический педикюр",200000,250000,60]},
  combi:{yes:["Комби педикюр + покрытие",280000,340000,90],no:["Комбинированный педикюр",230000,280000,60]}};
const TIERS=[
 {id:"top",name:"Топ‑мастер",d:"Сложные формы и дизайны, большое портфолио",badge:"Рекомендуем",people:[["Камила",17],["Хумайра",5]]},
 {id:"master",name:"Мастер",d:"Аккуратная работа по стандартам студии",people:[["Сурайё",10],["Комола",9],["Гульмира",2],["Нигора",0],["Феруза",0],["Сайёра",0]]}
];

/* ===== Логика маршрута ===== */
const A={};let hist=[],phase="start";
function flow(){
  const f=["area"],a=A.area;if(!a)return f;
  if(a==="hands"||a==="both"){f.push("cover","mtype");
    if(A.mtype==="gel")f.push("style","strength","length","design");
    else if(A.mtype==="bare")f.push("bare");
    else if(A.mtype==="halal")f.push("strength","length");}
  if(a==="feet"||a==="both")f.push("ptype","pcover","heels");
  if(a==="ext"){f.push("ext");if(A.ext==="new")f.push("extType");if(A.ext)f.push("design")}
  return f;
}
function lines(){
  const L=[];flow().forEach(q=>{const o=Q[q].o.find(x=>x.v===A[q]);if(o&&o.p)L.push(o.p)});
  if(A.ptype&&A.pcover){const p=PEDI[A.ptype][A.pcover];const i=L.findIndex(x=>x[0]==="Работа со сложными пятками");i>=0?L.splice(i,0,p):L.push(p)}
  return L;
}
const fmt=n=>n.toLocaleString("ru-RU").replace(/\u00a0/g," ");
const money=(a,b)=>a===b?`${fmt(a)} сум`:`${fmt(a)} – ${fmt(b)} сум`;
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h?`${h} ч${r?` ${r} мин`:""}`:`${r} мин`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function total(){const L=lines();return{L,min:L.reduce((s,x)=>s+x[1],0),max:L.reduce((s,x)=>s+x[2],0),t:L.reduce((s,x)=>s+x[3],0)}}
const $=s=>document.querySelector(s);
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2000)}

/* ===== Экраны ===== */
function show(html,prog,label){
  const v=$("#view");v.className="";void v.offsetWidth;v.className="enter";v.innerHTML=html;
  $("#top").hidden=phase==="start";
  if(prog!=null){$("#pb").style.width=prog+"%";$("#pt").textContent=label}
  window.scrollTo(0,0);
}
function start(){phase="start";show(`<div class="start">
  <img class="logo" alt="Za_manic studio" src="${CONFIG.logo}">
  <h1>Соберите свой визит<br>за 1 минуту</h1>
  <p>Ответьте на несколько простых вопросов — покажем готовый вариант и его цену.</p>
  <div class="fan">${["nude","french","color","ombre","chrome"].map(k=>`<div class="nl" style="background:${SW[k]}"></div>`).join("")}</div>
  <button class="cta" id="go">Начать</button>
  <div class="perks"><span>Цена сразу</span><span>Запись онлайн</span></div></div>`);
  $("#go").onclick=()=>{hist=[];ask("area")};
}
function ask(id){
  phase="q";const f=flow(),i=f.indexOf(id),q=Q[id];
  const n=i+1;
  show(`<h2>${q.t}</h2>${q.s?`<p class="sub">${q.s}</p>`:`<div style="height:12px"></div>`}
  <div class="opts ${q.two?"two":""}">${q.o.map(o=>{
    const price=o.p?`<span class="pr">${o.p[1]===o.p[2]&&!q.two?"+ ":""}${money(o.p[1],o.p[2])}</span>`:"";
    return q.two?`<button class="opt" data-v="${o.v}" aria-pressed="${A[id]===o.v}">${nails(SW[o.sw])}<span class="t"><b>${o.l}</b>${price}</span></button>`
      :`<button class="opt" data-v="${o.v}" aria-pressed="${A[id]===o.v}"><span class="ic">${IC[o.ic]||""}</span><span class="t"><b>${o.l}</b>${o.d?`<small>${o.d}</small>`:""}${price}</span></button>`}).join("")}</div>`,
  Math.round(i/(f.length+1)*100)+4,`Вопрос ${n} из ${estimate()}`);
  $("#view").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;
    A[id]=b.dataset.v;document.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));
    // сбросить ответы, которые больше не в маршруте
    const nf=flow();Object.keys(A).forEach(k=>{if(!nf.includes(k))delete A[k]});
    setTimeout(()=>{hist.push(id);const nx=nf[nf.indexOf(id)+1];nx?ask(nx):result()},220)};
}
function estimate(){ // сколько всего вопросов при текущих ответах
  const f=flow();let n=f.length;
  if(!A.area)return 6;
  if((A.area==="hands"||A.area==="both")&&!A.mtype)n+=3;
  if(A.area==="ext"&&!A.ext)n+=2;
  return n;
}
const C={tier:null,person:"Любой",day:null,time:null,name:"",phone:""};
const pick=x=>C.tier==="master"?x[1]:x[2];        // Мастер — нижняя граница прайса, Топ — верхняя
function tierTotal(id){const L=lines();return L.reduce((s,x)=>s+(id==="master"?x[1]:x[2]),0)}
const plural=(n,a,b,c)=>{const x=n%10,y=n%100;return x===1&&y!==11?a:x>=2&&x<=4&&(y<12||y>14)?b:c};
const CROWN=`<svg viewBox="0 0 48 48"><path d="M8 36l-3-20 11 8 8-14 8 14 11-8-3 20z" fill="url(#gg)" stroke="#7A5E33" stroke-width="1.2" stroke-linejoin="round"/><rect x="8" y="37" width="32" height="5" rx="2" fill="url(#gg)" stroke="#7A5E33" stroke-width="1.2"/><circle cx="24" cy="29" r="2.4" fill="#fff" opacity=".85"/><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0DCAE"/><stop offset=".55" stop-color="#C9A66B"/><stop offset="1" stop-color="#9C7A45"/></linearGradient></defs></svg>`;
const SPARK=`<svg viewBox="0 0 48 48" fill="none" stroke="#B08D57" stroke-width="2" stroke-linejoin="round"><path d="M22 6l3.5 10.5L36 20l-10.5 3.5L22 34l-3.5-10.5L8 20l10.5-3.5z" fill="#F3E6CC"/><path d="M37 30l1.6 4.4L43 36l-4.4 1.6L37 42l-1.6-4.4L31 36l4.4-1.6z" fill="#F3E6CC"/></svg>`;
function result(){
  phase="res";const{L,t}=total();
  show(`<h2>Ваш вариант готов</h2><p class="sub">В визит войдёт:</p>
  <div class="res">${L.map(x=>`<div class="line"><span>${x[0]}</span><span class="mut">${dur(x[3])}</span></div>`).join("")}
    <div class="line tot"><span>Время визита</span><span>≈ ${dur(t)}</span></div>${A.area==="both"?`<p class="fine" style="margin:6px 0 0;text-align:left">В 4 руки маникюр и педикюр делают одновременно — визит займёт меньше времени.</p>`:""}</div>
  <h3 class="h3">Выберите уровень мастера</h3>
  <div class="tiers">${TIERS.map(T=>`<button class="tier t-${T.id}" data-t="${T.id}" aria-pressed="${C.tier===T.id}">
    ${T.badge?`<span class="tb">${T.badge}</span>`:""}
    <span class="ti">${T.id==="top"?CROWN:SPARK}</span>
    <span class="tt"><b>${T.name}</b><small>${T.people.length} ${plural(T.people.length,"мастер","мастера","мастеров")}</small></span>
    <span class="tp">${fmt(tierTotal(T.id))} сум</span>
    <span class="td">${T.d}</span></button>`).join("")}</div>
  <p class="fine">Цена за весь визит. Мастер подтвердит её до начала процедуры.</p>
  <div class="actions"><button class="cta" id="book" ${C.tier?"":"disabled"}>Записаться</button><button class="ghost" id="redo">Пройти заново</button></div>`,100,"Ваш вариант");
  $("#view").onclick=e=>{const b=e.target.closest(".tier");if(!b)return;if(C.tier!==b.dataset.t)C.person="Любой";C.tier=b.dataset.t;document.querySelectorAll(".tier").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#book").disabled=false};
  $("#book").onclick=()=>C.tier&&form();
  $("#redo").onclick=()=>{Object.keys(A).forEach(k=>delete A[k]);C.tier=null;hist=[];ask("area")};
}
const WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"],WDF=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"],MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse=k=>{const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)};
function days(){const o=[],d=new Date();d.setHours(0,0,0,0);for(let i=0;i<14;i++){const x=new Date(d);x.setDate(d.getDate()+i);o.push(x)}return o}
function slots(k){const need=Math.max(total().t,30),o=[],now=new Date(),today=k===key(now);
  for(let m=9*60;m+need<=21*60;m+=30){if(today&&m<now.getHours()*60+now.getMinutes()+60)continue;o.push(`${String(m/60|0).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`)}return o}
function when(){const d=parse(C.day);return `${d.getDate()} ${MON[d.getMonth()]}, ${WDF[d.getDay()]}, ${C.time}`}
function form(){
  phase="form";const T=TIERS.find(x=>x.id===C.tier),{L,t}=total(),sum=tierTotal(C.tier);
  const ds=days();if(!C.day||!slots(C.day).length)C.day=key(ds.find(d=>slots(key(d)).length));
  const sl=slots(C.day);if(C.time&&!sl.includes(C.time))C.time=null;
  show(`<h2>Оформление записи</h2><p class="sub">Проверьте детали и выберите время.</p>
  <div class="check">
    <div class="ch-h"><span class="ti sm">${T.id==="top"?CROWN:SPARK}</span><div><b>${T.name}</b><small>${C.person==="Любой"?"Любой свободный мастер":C.person}</small></div><button class="edit" id="chT">Изменить</button></div>
    ${L.map(x=>`<div class="line"><span>${x[0]}</span><span>${fmt(pick(x))} сум</span></div>`).join("")}
    <div class="line tot"><span>Итого · ≈ ${dur(t)}</span><span>${fmt(sum)} сум</span></div>
  </div>
  <div class="f"><span>Мастер</span><div class="chips" id="people">${[["Любой",null],...T.people].map(([n,r])=>`<button class="chip" data-p="${n}" aria-pressed="${C.person===n}">${n==="Любой"?"Любой свободный":n}${r?` <em>${r} ${plural(r,"отзыв","отзыва","отзывов")}</em>`:""}</button>`).join("")}</div></div>
  <div class="f"><span>Дата</span><div class="days" id="days">${ds.map((d,i)=>`<button class="day" data-d="${key(d)}" aria-pressed="${C.day===key(d)}" ${slots(key(d)).length?"":"disabled"}><small>${i===0?"Сег.":i===1?"Завт.":WD[d.getDay()]}</small><b>${d.getDate()}</b><small>${MON[d.getMonth()].slice(0,3)}</small></button>`).join("")}</div></div>
  <div class="f"><span>Время</span><div class="slots" id="slots">${sl.map(x=>`<button class="slot" data-s="${x}" aria-pressed="${C.time===x}">${x}</button>`).join("")}</div><div class="e" id="es"></div></div>
  <div class="f"><label for="fn">Имя</label><input id="fn" autocomplete="given-name" placeholder="Ваше имя" value="${esc(C.name)}"><div class="e" id="en"></div></div>
  <div class="f"><label for="fp">Телефон</label><input id="fp" type="tel" inputmode="numeric" autocomplete="tel" placeholder="+998 (__) ___-__-__" value="${esc(C.phone)}"><div class="e" id="ep"></div></div>
  <div class="actions"><button class="cta" id="send">Отправить заявку · ${fmt(sum)} сум</button></div>`,100,"Оформление");
  const D=$("#days"),a=D.querySelector('[aria-pressed="true"]');if(a)D.scrollLeft=a.offsetLeft-D.offsetLeft-8;
  $("#chT").onclick=result;
  $("#people").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;C.person=b.dataset.p;const y=scrollY,sx=D.scrollLeft;form();scrollTo(0,y);$("#days").scrollLeft=sx};
  D.onclick=e=>{const b=e.target.closest(".day");if(!b||b.disabled)return;C.day=b.dataset.d;C.time=null;const y=scrollY,sx=D.scrollLeft;form();scrollTo(0,y);$("#days").scrollLeft=sx};
  $("#slots").onclick=e=>{const b=e.target.closest(".slot");if(!b)return;C.time=b.dataset.s;$("#es").textContent="";document.querySelectorAll(".slot").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  const n=$("#fn"),p=$("#fp");
  n.oninput=()=>{C.name=n.value;$("#en").textContent=""};
  p.onfocus=()=>{if(!p.value)p.value="+998 ("};
  p.oninput=()=>{p.value=mask(p.value);C.phone=p.value;$("#ep").textContent=""};
  $("#send").onclick=()=>{let ok=true;
    if(!C.time){$("#es").textContent="Выберите время";ok=false}
    if(C.name.trim().length<2){$("#en").textContent="Укажите имя";ok=false}
    if(C.phone.replace(/\D/g,"").length!==12){$("#ep").textContent="Введите номер полностью";ok=false}
    if(ok){try{const T=TIERS.find(x=>x.id===C.tier);ZMTracker.submit({name:C.name.trim(),phone:C.phone,service:total().L.map(x=>x[0]).join(', '),master:(T?T.name:'')+(C.person!=='Любой'?', '+C.person:''),desired_time:when()})}catch(e){}done()}else{const e=[...document.querySelectorAll(".e")].find(x=>x.textContent);e&&e.scrollIntoView({block:"center",behavior:"smooth"})}};
}
function mask(v){let d=v.replace(/\D/g,"");if(d.startsWith("998"))d=d.slice(3);d=d.slice(0,9);if(!d.length)return"+998 (";
  let o="+998 ("+d.slice(0,2);if(d.length>=2)o+=")";if(d.length>2)o+=" "+d.slice(2,5);if(d.length>5)o+="-"+d.slice(5,7);if(d.length>7)o+="-"+d.slice(7,9);return o}
function text(){const{L,t}=total(),T=TIERS.find(x=>x.id===C.tier);
  return `Здравствуйте! Хочу записаться в Za_manic.
Имя: ${C.name.trim()}
Телефон: ${C.phone}
Уровень: ${T.name}${C.person!=="Любой"?`, мастер ${C.person}`:", любой свободный мастер"}
Услуги:
${L.map(x=>`— ${x[0]}: ${fmt(pick(x))} сум`).join("\n")}
Итого: ${fmt(tierTotal(C.tier))} сум, ≈ ${dur(t)}
Дата: ${when()}`}
function done(){
  phase="done";
  show(`<div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h2 style="text-align:center">Заявка готова!</h2><p class="sub" style="text-align:center">Нажмите кнопку — текст скопируется, вставьте его в чат с администратором.</p>
  <div class="msg" id="msg">${esc(text())}</div>
  <div class="actions"><a class="cta" id="tg" href="https://t.me/${CONFIG.telegram}" target="_blank" rel="noopener">Отправить в Telegram</a><button class="ghost" id="cp">Скопировать текст</button></div>`,100,"Готово");
  const cp=async()=>{try{await navigator.clipboard.writeText(text());return true}catch(e){const r=document.createRange();r.selectNodeContents($("#msg"));const s=getSelection();s.removeAllRanges();s.addRange(r);try{return document.execCommand("copy")}catch(_){return false}}};
  $("#tg").onclick=()=>{cp()};$("#cp").onclick=async()=>toast(await cp()?"Текст скопирован":"Выделите текст и скопируйте");
}
$("#back").onclick=()=>{
  if(phase==="q"){const p=hist.pop();p?ask(p):start()}
  else if(phase==="res"){ask(hist.pop())}
  else if(phase==="form")result();
  else if(phase==="done")form();
};
start();
</script>
